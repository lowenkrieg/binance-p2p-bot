name: Ejecutar Monitor P2P

on:
  schedule:
    # Este disparador ejecuta el script cada hora de forma automática (sistema Cron)
    - cron: '0 * * * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un botón cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: pip install requests

      - name: Ejecutar el script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
