name: Ejecutar Monitor P2P

on:
  schedule:
    # Ejecuta automáticamente cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual con el botón

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4 # Actualizado a v4 para soportar Node moderno

      - name: Configurar Python
        uses: actions/setup-python@v5 # Actualizado a v5 para evitar advertencias
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: pip install requests

      - name: Ejecutar el script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
